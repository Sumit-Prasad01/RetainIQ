services:

  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: retainiq_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: